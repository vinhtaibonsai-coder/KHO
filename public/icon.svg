<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#452213"/>
      <stop offset="50%" stop-color="#2D150B"/>
      <stop offset="100%" stop-color="#1A0A04"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Nền bo tròn chuẩn iOS Apple Touch Icon -->
  <rect width="100%" height="100%" rx="112" fill="url(#woodBg)"/>
  
  <!-- Vòng tròn hào quang vân gỗ nghệ thuật -->
  <circle cx="256" cy="235" r="185" fill="none" stroke="url(#ringGold)" stroke-width="3.5"/>
  <circle cx="256" cy="235" r="168" fill="#200E06" fill-opacity="0.45"/>

  <!-- Khối Lũa Nghệ Thuật / Biểu tượng Kho Isometric -->
  <g filter="url(#shadow)">
    <!-- Mặt đỉnh khối gỗ -->
    <path d="M145 185 L256 120 L367 185 L256 250 Z" fill="url(#goldTop)"/>
    <!-- Mặt trái khối gỗ -->
    <path d="M145 200 L256 265 L256 380 L145 315 Z" fill="url(#goldLeft)"/>
    <!-- Mặt phải khối gỗ -->
    <path d="M367 200 L256 265 L256 380 L367 315 Z" fill="url(#goldRight)"/>
  </g>

  <!-- Chữ LŨA NHỰT mang đậm bản sắc mộc -->
  <text x="50%" y="435" font-size="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" fill="#FDE68A" text-anchor="middle" letter-spacing="4">LŨA NHỰT</text>
  <text x="50%" y="468" font-size="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" fill="#D97706" text-anchor="middle" letter-spacing="2">QUẢN LÝ KHO</text>
</svg>